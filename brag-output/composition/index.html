<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f7f8fa; }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: #f7f8fa; overflow: hidden; }
      #grid { position: absolute; inset: -64px; background-image: linear-gradient(#e9ecf3 1px, transparent 1px), linear-gradient(90deg, #e9ecf3 1px, transparent 1px);
        background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 80%); mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 80%); }
      #glow { position: absolute; width: 1200px; height: 900px; left: 1000px; top: -120px; background: radial-gradient(closest-side, rgba(12,75,234,.10), rgba(12,75,234,0)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-fps="30" data-width="1920" data-height="1080">
      <div id="ground" style="z-index:0"><div id="grid" data-layout-allow-overflow></div><div id="glow" data-layout-allow-overflow></div></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="ask" data-composition-id="ask" data-composition-src="compositions/ask.html" data-start="4" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="floor" data-composition-id="floor" data-composition-src="compositions/floor.html" data-start="8" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="results" data-composition-id="results" data-composition-src="compositions/results.html" data-start="12" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="17" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="22" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glow", { x: 0 }, { x: -160, duration: 22, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
